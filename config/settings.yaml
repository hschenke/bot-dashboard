# Deklarative Standardkonfiguration für das Holli Dashboard
default_language: "de"

apps:
  news_bot:
    title: "News-Bot"
    icon: "📰"
    description: "KI-gestützter RSS-News-Kurator mit täglichem E-Mail-Digest, Volltext-Archiv & Ad-hoc-Briefings."
    streamlit_url: ""
    github_repo: ""
    primary_workflow: "daily_digest.yaml"
    secondary_workflows:
      - "update_rss.yaml"
    turso_url: ""
    local_sqlite_path: ""
    expected_tables:
      - "articles"
      - "archived_articles"
      - "briefings"
      - "offline_articles"
      - "settings_backups"

  research_bot:
    title: "Research-Bot"
    icon: "🔬"
    description: "Autonomer Deep-Web-Research-Bot (>1h Laufzeit) mit Checkpointing, Google Search Grounding & Dossier-Synthese."
    streamlit_url: ""
    github_repo: ""
    primary_workflow: "run_research.yaml"
    secondary_workflows:
      - "ci.yaml"
    turso_url: ""
    local_sqlite_path: ""
    expected_tables:
      - "research_jobs"
      - "research_reports"
      - "app_domain_config"

  alert_bot:
    title: "Alert-Bot"
    icon: ":material/notifications_active:"
    description: "24/7 Smart-Alert-Bot für Wetter, Mietwohnungen, Preise, Seitenänderungen & Uptime mit Anti-Spam-Gedächtnis."
    streamlit_url: ""
    github_repo: ""
    primary_workflow: "check_alerts.yaml"
    secondary_workflows:
      - "ci.yaml"
    turso_url: ""
    local_sqlite_path: ""
    expected_tables:
      - "alert_rules"
      - "alert_events"
      - "alert_check_logs"
      - "alert_seen_items"
