# Deklarative Standardkonfiguration für das Holli Dashboard
default_language: "de"

allowed_models:
  - "gemini-3.5-flash-lite"
  - "gemini-3.8-flash"
  - "gemini-3.1-flash-lite"
  - "gemini-4-argon"

apps:
  news_bot:
    title: "News-Bot"
    icon: "📰"
    description: "KI-gestützter RSS-News-Kurator mit täglichem E-Mail-Digest, Volltext-Archiv & Ad-hoc-Briefings."
    streamlit_url: ""
    github_repo: ""
    primary_workflow: "daily_digest.yaml"
    secondary_workflows:
      - "update_rss.yaml"
    turso_url: ""
    local_sqlite_path: ""
    expected_tables:
      - "articles"
      - "archived_articles"
      - "briefings"
      - "offline_articles"
      - "settings_backups"

  research_bot:
    title: "Research-Bot"
    icon: "🔬"
    description: "Autonomer Deep-Web-Research-Bot (>1h Laufzeit) mit Checkpointing, Google Search Grounding & Dossier-Synthese."
    streamlit_url: ""
    github_repo: ""
    primary_workflow: "run_research.yaml"
    secondary_workflows:
      - "ci.yaml"
    turso_url: ""
    local_sqlite_path: ""
    expected_tables:
      - "research_jobs"
      - "research_reports"
      - "app_domain_config"

  alert_bot:
    title: "Alert-Bot"
    icon: "🔔"
    description: "24/7 Smart-Alert-Bot für Wetter, Mietwohnungen, Preise, Seitenänderungen & Uptime mit Anti-Spam-Gedächtnis."
    streamlit_url: ""
    github_repo: ""
    primary_workflow: "check_alerts.yaml"
    secondary_workflows:
      - "ci.yaml"
    turso_url: ""
    local_sqlite_path: ""
    expected_tables:
      - "alert_rules"
      - "alert_events"
      - "alert_check_logs"
      - "alert_seen_items"

prompts:
  fleet_diagnosis_system_prompt: >-
    Du bist ein präziser Site-Reliability- & KI-Systemarchitekt für eine Flotte
    autonomer Streamlit/Turso/GitHub-Actions-Applikationen.
    Analysiere die übergebenen Echtzeit-Telemetriedaten (HTTP/Streamlit-Status, Latenzen,
    GitHub-Actions-Läufe, Datenbank-Tabellenstände und jüngste Fehler).
    Liefere eine faktenbasierte, prägnante Diagnose ohne Fülltext. Erfinde niemals Metriken.
  fleet_qa_system_prompt: >-
    Du bist der KI-Operations-Assistent des Dashboards. Beantworte die Frage des Nutzers
    direkt, präzise und ausschließlich auf Basis der bereitgestellten Live-Telemetriedaten
    der überwachten Apps.
