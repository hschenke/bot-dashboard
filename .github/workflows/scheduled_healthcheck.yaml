name: Fleet Health-Check & Wakeup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

jobs:
  check-fleet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v7

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-worker.txt"

      - name: Worker-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt

      - name: Flotten-Checks & Wakeup für alle Apps + Dashboard ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_FLEET_TOKEN }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_KEY: ${{ secrets.TURSO_KEY }}
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
          NEWS_BOT_URL: ${{ secrets.NEWS_BOT_URL }}
          NEWS_BOT_TURSO_URL: ${{ secrets.NEWS_BOT_TURSO_URL }}
          NEWS_BOT_TURSO_KEY: ${{ secrets.NEWS_BOT_TURSO_KEY }}
          RESEARCH_BOT_URL: ${{ secrets.RESEARCH_BOT_URL }}
          RESEARCH_BOT_TURSO_URL: ${{ secrets.RESEARCH_BOT_TURSO_URL }}
          RESEARCH_BOT_TURSO_KEY: ${{ secrets.RESEARCH_BOT_TURSO_KEY }}
          ALERT_BOT_URL: ${{ secrets.ALERT_BOT_URL }}
          ALERT_BOT_TURSO_URL: ${{ secrets.ALERT_BOT_TURSO_URL }}
          ALERT_BOT_TURSO_KEY: ${{ secrets.ALERT_BOT_TURSO_KEY }}
        run: python -m src.worker.cli_check --wake
